<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ShopBills</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#faf7f0;--card:#fff;--tx:#1c1710;--mu:#8a7f6b;--gd:#b8860b;--gd2:#e6c35c;--ln:#eadfc6;--ok:#1f8a5b;--rd:#c8433a;--am:#b87a00;--sh:0 8px 24px rgba(120,90,20,.1);--hero:linear-gradient(135deg,#1c1710,#43361a);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c0b09;--card:#17150f;--tx:#f5ecd6;--mu:#a89c80;--gd:#e0b84c;--gd2:#f3d98a;--ln:#2c2616;--ok:#4ac98b;--rd:#ff7a6e;--am:#f0b64a;--sh:0 8px 24px rgba(0,0,0,.5);--hero:linear-gradient(135deg,#17130a,#3a2d10);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0c0b09;--card:#17150f;--tx:#f5ecd6;--mu:#a89c80;--gd:#e0b84c;--gd2:#f3d98a;--ln:#2c2616;--ok:#4ac98b;--rd:#ff7a6e;--am:#f0b64a;--sh:0 8px 24px rgba(0,0,0,.5);--hero:linear-gradient(135deg,#17130a,#3a2d10);color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:100px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#1c1710;z-index:60}
.wrap{max-width:560px;margin:0 auto;padding:14px}
h1,h2,.big{font-family:"Playfair Display",Georgia,serif}
h1{font-size:26px;margin:2px 0;color:#f5ecd6}h2{font-size:18px;margin:22px 0 10px}
.hero{background:var(--hero);color:#d9cba8;margin:-14px -14px 16px;padding:18px 18px 56px;border-radius:0 0 32px 32px}
.brand{font-size:11px;letter-spacing:3px;color:var(--gd2);font-weight:700}.hs{font-size:13px;opacity:.85}
.sp{display:flex;justify-content:space-between;gap:10px;align-items:center}.who{display:flex;gap:12px;align-items:center;min-width:0}
.av{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--gd2),var(--gd));color:#1c1710;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none;cursor:pointer;font-family:Georgia,serif;font-size:18px}
.pav{width:84px;height:84px;font-size:36px;margin:0 auto 10px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:var(--sh)}
.float{margin-top:-56px;position:relative}.float .big{font-size:34px;color:var(--gd)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}.grid .card{margin:0;padding:14px}
.big{font-size:24px;font-weight:700}.mu{color:var(--mu);font-size:13px}label{font-size:12px;color:var(--mu);font-weight:600}
input,select,textarea,button{font:inherit;color:var(--tx)}
input,select,textarea{width:100%;padding:12px;border:1.5px solid var(--ln);border-radius:14px;background:var(--bg);margin:4px 0 10px;outline:0}
input:focus,select:focus,textarea:focus{border-color:var(--gd)}input[type=checkbox]{width:auto;margin:0 8px 0 0}
button{border:0;border-radius:14px;padding:12px 16px;background:linear-gradient(135deg,var(--gd2),var(--gd));color:#1c1710;font-weight:700;cursor:pointer}
button:active{transform:scale(.97)}button.g{background:transparent;border:1.5px solid var(--gd);color:var(--gd)}button.x{background:transparent;color:var(--rd);padding:8px}
button.w{width:100%}.row{display:flex;gap:8px}.row>*{flex:1}.acts{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}.acts button{padding:8px 12px;font-size:13px}
.tag{display:inline-block;font-size:11px;padding:3px 10px;border-radius:99px;font-weight:700;white-space:nowrap;border:1px solid var(--ok);color:var(--ok)}
.tag.r{border-color:var(--rd);color:var(--rd)}.tag.a{border-color:var(--am);color:var(--am)}
.chips{display:flex;gap:8px;margin-bottom:12px}.chip{background:var(--card);color:var(--mu);border:1px solid var(--ln);padding:8px 14px;font-size:13px;border-radius:99px}
.chip.on{background:linear-gradient(135deg,var(--gd2),var(--gd));color:#1c1710;border-color:transparent}
img.th{width:100%;max-height:200px;object-fit:cover;border-radius:14px;margin-top:10px;cursor:zoom-in}
.nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--ln);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:30}
.nav button{flex:1;background:none;color:var(--mu);padding:6px 2px;font-size:11px;font-weight:600;border-radius:12px}.nav button.on{color:var(--gd)}.nav span{display:block;font-size:20px}
.fab{position:fixed;right:18px;bottom:calc(86px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;font-size:30px;padding:0;z-index:31;box-shadow:0 8px 22px rgba(184,134,11,.45)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:28px 28px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow:auto}
.zoom{align-items:center;padding:12px}.zoom img{max-width:100%;max-height:90vh;border-radius:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));background:#1c1710;color:var(--gd2);padding:10px 18px;border-radius:99px;z-index:70;font-weight:600;font-size:14px}
.bars{display:flex;align-items:flex-end;gap:8px;height:130px;margin-top:8px}.bars div{flex:1;text-align:center;font-size:11px;color:var(--mu);display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.bars i{display:block;background:linear-gradient(180deg,var(--gd2),var(--gd));border-radius:8px 8px 2px 2px;min-height:3px;margin-bottom:4px}
.login{min-height:100vh;background:var(--hero);padding:14px}.auth{max-width:400px;margin:0 auto;padding-top:7vh;color:#d9cba8}
.logo{width:76px;height:76px;border-radius:26px;background:linear-gradient(135deg,var(--gd2),var(--gd));display:flex;align-items:center;justify-content:center;font-size:38px;margin-bottom:16px}
.auth .card{color:var(--tx)}.feat{display:flex;justify-content:space-between;font-size:12px;margin:18px 4px;color:var(--gd2)}
.err{color:var(--rd);font-size:13px;min-height:18px}.empty{text-align:center;color:var(--mu);padding:26px 10px}
table{width:100%;border-collapse:collapse;font-size:14px}td{padding:8px 0;border-bottom:1px solid var(--ln)}td:last-child{text-align:right;font-weight:700}
</style></head><body><div id="app"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mem={};
const idb=new Promise(r=>{try{const q=indexedDB.open('shopbills',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch(e){r(null)}});
async function get(k){const d=await idb;if(!d)return mem[k];return new Promise(r=>{try{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r(undefined)}catch(e){r(mem[k])}})}
async function put(k,v){mem[k]=v;const d=await idb;if(!d)return;try{d.transaction('kv','readwrite').objectStore('kv').put(v,k)}catch(e){}}
async function hash(s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return btoa(s)}}
const E=()=>({dist:[],bills:[],profile:{}});
let user=null,D=E(),tab='home',mode='login',msg='',sheet=null,pic=null,q='',flt='all',zoom=null;
try{user=localStorage.getItem('sb_user')}catch(e){}
function theme(t){try{if(t)localStorage.setItem('sb_theme',t);t=localStorage.getItem('sb_theme')}catch(e){}const h=document.documentElement;if(t==='light'||t==='dark')h.dataset.theme=t;else delete h.dataset.theme}
theme();
const uid=()=>Math.random().toString(36).slice(2,9),loc=d=>new Date(d+'T00:00:00');
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const inr=n=>'₹'+Number(n||0).toLocaleString('en-IN'),fd=d=>d?loc(d).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}):'';
const days=d=>d?Math.round((loc(d)-loc(today()))/864e5):null,mon=d=>(d||'').slice(0,7),save=()=>put('data:'+user,D);
const sup=id=>D.dist.find(x=>x.id===id),dn=id=>{const d=sup(id);return d?d.name+(d.company?' · '+d.company:''):'Removed supplier'};
const owed=id=>D.bills.filter(b=>b.dist===id&&!b.paid).reduce((s,b)=>s+b.amount,0),sum=a=>a.reduce((s,b)=>s+b.amount,0);
const P=()=>D.profile||{},nm=()=>P().name||user,ini=()=>esc(nm()[0].toUpperCase());
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}
async function boot(){if(user)D=(await get('data:'+user))||E();render()}
async function auth(){
  const u=$('#u').value.trim().toLowerCase(),p=$('#p').value;
  if(!u||p.length<4){msg='Enter a username and a password of 4+ characters.';return render()}
  const users=(await get('users'))||{},h=await hash(p);
  if(mode==='signup'){if(users[u]){msg='That username is taken.';return render()}users[u]=h;await put('users',users)}
  else if(users[u]!==h){msg='Wrong username or password.';return render()}
  user=u;msg='';tab='home';try{localStorage.setItem('sb_user',u)}catch(e){}
  D=(await get('data:'+u))||E();if(mode==='signup'){D.profile={email:$('#em')?.value.trim()||''};await save()}render();
}
function logout(){user=null;try{localStorage.removeItem('sb_user')}catch(e){}render()}
function compress(f){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,1000/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.7))};i.onerror=()=>res(null);i.src=r.result};r.onerror=()=>res(null);r.readAsDataURL(f)})}
async function prev(el){pic=el.files[0]?await compress(el.files[0]):null;$('#pv').innerHTML=pic?`<img class="th" src="${pic}" alt="Preview">`:''}
const openSheet=(type,id)=>{sheet={type,id};pic=null;render()},shut=()=>{sheet=null;render()};
async function saveBill(){
  const v=i=>$('#sb'+i).value,amt=+v(3);
  if(!v(1))return toast('Add a supplier first');if(!amt)return toast('Enter the bill amount');
  const paid=$('#sb6').checked,o=sheet.id&&D.bills.find(b=>b.id===sheet.id)||{id:uid(),img:null};
  Object.assign(o,{dist:v(1),date:v(2)||today(),amount:amt,note:v(4).trim(),paid,paidOn:paid?(o.paidOn||today()):null});
  if(pic)o.img=pic;if(!sheet.id)D.bills.unshift(o);
  await save();sheet=null;render();toast('Bill saved ✓');
}
async function saveDist(){
  const v=i=>$('#sd'+i).value.trim();if(!v(1))return toast('Enter the supplier name');
  const o=sheet.id&&sup(sheet.id)||{id:uid()};
  Object.assign(o,{name:v(1),company:v(2),phone:v(3),next:$('#sd4').value,advance:+v(5)||0,note:v(6)});
  if(!sheet.id)D.dist.push(o);await save();sheet=null;render();toast('Supplier saved ✓');
}
async function pay(id){const b=D.bills.find(x=>x.id===id);b.paid=!b.paid;b.paidOn=b.paid?today():null;await save();render();toast(b.paid?'Marked as paid ✓':'Marked as unpaid')}
async function delBill(id){if(confirm('Delete this bill?')){D.bills=D.bills.filter(x=>x.id!==id);await save();render()}}
async function delDist(id){if(confirm('Delete this supplier? Their bills stay in your records.')){D.dist=D.dist.filter(x=>x.id!==id);await save();render()}}
async function saveProfile(){
  const g=i=>$('#pf'+i).value.trim(),em=g(3);
  if(em&&!/^\S+@\S+\.\S+$/.test(em))return toast('Enter a valid email address');
  D.profile={name:g(1),shop:g(2),email:em,phone:g(4),addr:g(5)};await save();render();toast('Profile saved ✓');
}
async function savePass(){
  const o=$('#po').value,n=$('#pn').value,us=(await get('users'))||{};
  if(us[user]!==await hash(o))return toast('Current password is wrong');
  if(n.length<4)return toast('New password needs 4+ characters');
  us[user]=await hash(n);await put('users',us);$('#po').value=$('#pn').value='';toast('Password updated ✓');
}
async function dlSave(name,blob){try{const dl=await claude.use('downloads');if(!dl)return toast('Download is not available in this view');await dl.save({filename:name,data:blob})}catch(e){toast('Download failed')}}
function exportXlsx(){
  if(typeof XLSX==='undefined')return toast('Excel library did not load');
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(D.bills.map(b=>({Date:b.date,Supplier:dn(b.dist),Amount:b.amount,Status:b.paid?'Paid':'Unpaid','Paid on':b.paidOn||'',Items:b.note,'Has photo':b.img?'Yes':'No'}))),'Bills');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(D.dist.map(d=>({Name:d.name,Company:d.company,Phone:d.phone,'Next visit':d.next,'Advance to pay':d.advance,'Total owed':owed(d.id)}))),'Suppliers');
  dlSave('shopbills-'+today()+'.xlsx',new Blob([XLSX.write(wb,{type:'array',bookType:'xlsx'})]));
}
const backup=()=>dlSave('shopbills-backup-'+today()+'.json',new Blob([JSON.stringify(D)],{type:'application/json'}));
function restore(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=async()=>{try{const j=JSON.parse(r.result);if(!Array.isArray(j.bills)||!Array.isArray(j.dist))throw 0;D={dist:j.dist,bills:j.bills,profile:j.profile||{}};await save();render();toast('Backup restored ✓')}catch(e){toast('That is not a valid backup file')}};r.readAsText(f)}
async function wipe(){if(confirm('Delete ALL bills and suppliers? This cannot be undone.')){D={...E(),profile:P()};await save();render();toast('All data cleared')}}

const hero=(t,s)=>`<div class="hero"><div class="sp"><div><div class="brand">SHOPBILLS</div><h1>${t}</h1><div class="hs">${s}</div></div><div class="av" onclick="tab='prof';render()">${ini()}</div></div></div>`;
const due=d=>{const n=days(d);return n===null?'<span class="tag a">No date set</span>':n<0?`<span class="tag r">${-n}d overdue</span>`:n===0?'<span class="tag a">Today</span>':n<=7?`<span class="tag a">In ${n} days</span>`:`<span class="tag">${fd(d)}</span>`};
const supRow=d=>`<div class="card"><div class="sp"><div class="who"><div class="av">${esc(d.name[0].toUpperCase())}</div><div><b>${esc(d.name)}</b><div class="mu">${esc(d.company)||'No company'}${d.phone?' · '+esc(d.phone):''}</div></div></div>${due(d.next)}</div>
  <div class="grid" style="margin:10px 0 0"><div><label>Owed</label><div><b>${inr(owed(d.id))}</b></div></div><div><label>Advance to keep ready</label><div><b>${inr(d.advance)}</b></div></div></div>
  <div class="acts">${d.phone?`<a href="tel:${esc(d.phone)}"><button class="g">Call</button></a><a href="https://wa.me/${esc(d.phone.replace(/\D/g,''))}" target="_blank" rel="noopener"><button class="g">WhatsApp</button></a>`:''}<button class="g" onclick="openSheet('dist','${d.id}')">Edit</button><button class="x" onclick="delDist('${d.id}')">Delete</button></div></div>`;
const billCard=b=>`<div class="card"><div class="sp" style="align-items:flex-start"><div><b>${esc(dn(b.dist))}</b><div class="mu">${fd(b.date)}${b.note?' · '+esc(b.note):''}</div></div><div style="text-align:right"><b class="big" style="font-size:19px">${inr(b.amount)}</b><br><span class="tag ${b.paid?'':'r'}">${b.paid?'Paid':'Unpaid'}</span></div></div>
  ${b.img?`<img class="th" src="${b.img}" alt="Bill photo" onclick="zoom='${b.id}';render()">`:''}
  <div class="acts"><button onclick="pay('${b.id}')">Mark ${b.paid?'unpaid':'paid'}</button><button class="g" onclick="openSheet('bill','${b.id}')">Edit</button><button class="x" onclick="delBill('${b.id}')">Delete</button></div></div>`;
function billList(){
  const s=q.toLowerCase(),l=D.bills.filter(b=>(flt==='all'||(flt==='paid')===b.paid)&&(!s||(dn(b.dist)+' '+b.note).toLowerCase().includes(s)));
  return l.map(billCard).join('')||`<div class="empty">${D.bills.length?'No bills match your search.':'No bills yet. Tap + to add your first bill.'}</div>`;
}
function view(){
  const un=D.bills.filter(b=>!b.paid),m=today().slice(0,7),up=D.dist.filter(d=>d.next).sort((a,b)=>a.next.localeCompare(b.next));
  if(tab==='home'){const od=up.filter(d=>days(d.next)<0).length,wk=up.filter(d=>days(d.next)>=0&&days(d.next)<=7).length;
    return hero('Hello, '+esc(nm()),fd(today()))+`<div class="card float"><label>TOTAL TO PAY</label><div class="big">${inr(sum(un))}</div><div class="mu">across ${un.length} unpaid bill${un.length===1?'':'s'}</div></div>
    <div class="grid"><div class="card"><label>Paid this month</label><div class="big">${inr(sum(D.bills.filter(b=>b.paid&&mon(b.paidOn)===m)))}</div></div><div class="card"><label>Bills this month</label><div class="big">${D.bills.filter(b=>mon(b.date)===m).length}</div></div>
    <div class="card"><label>Suppliers</label><div class="big">${D.dist.length}</div></div><div class="card"><label>Visits this week</label><div class="big">${wk}</div></div></div>
    ${od?`<div class="card" style="border-color:var(--rd)"><b style="color:var(--rd)">${od} supplier visit${od>1?'s are':' is'} overdue</b><div class="mu">Check the dates below and update them.</div></div>`:''}
    <div class="row"><button onclick="openSheet('bill')">+ Add bill</button><button class="g" onclick="openSheet('dist')">+ Add supplier</button></div>
    <h2>Upcoming supplier visits</h2>${up.slice(0,4).map(supRow).join('')||'<div class="empty">Add a supplier and set the next visit date.</div>'}
    <h2>Recent bills</h2>${D.bills.slice(0,3).map(billCard).join('')||'<div class="empty">Your bills will show here.</div>'}`}
  if(tab==='bills')return hero('Bills',D.bills.length+' saved')+`<input placeholder="Search supplier or items" value="${esc(q)}" oninput="q=this.value;$('#bl').innerHTML=billList()" style="margin-top:-30px;position:relative">
    <div class="chips">${['all','unpaid','paid'].map(k=>`<button class="chip ${flt===k?'on':''}" onclick="flt='${k}';render()">${k[0].toUpperCase()+k.slice(1)}</button>`).join('')}</div><div id="bl">${billList()}</div>`;
  if(tab==='dist')return hero('Suppliers',D.dist.length+' added')+`<div style="margin-top:-30px;position:relative">${D.dist.map(supRow).join('')||'<div class="empty card">No suppliers yet. Tap + to add one.</div>'}</div>`;
  if(tab==='rep'){const ms=[...Array(6)].map((_,i)=>{const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-5+i);const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');return{k,l:d.toLocaleString('en',{month:'short'}),v:sum(D.bills.filter(b=>mon(b.date)===k))}}),mx=Math.max(1,...ms.map(x=>x.v));
    return hero('Reports','Your spending at a glance')+`<div class="card float"><b>Billed per month</b><div class="bars">${ms.map(x=>`<div><i style="height:${Math.round(x.v/mx*100)}%"></i>${x.l}</div>`).join('')}</div></div>
    <div class="card"><b>Owed by supplier</b><table>${D.dist.map(d=>[d,owed(d.id)]).sort((a,b)=>b[1]-a[1]).map(([d,v])=>`<tr><td>${esc(d.name)}</td><td>${inr(v)}</td></tr>`).join('')||'<tr><td>No suppliers yet</td><td></td></tr>'}</table></div>
    <button class="w" onclick="exportXlsx()">Download Excel report</button>`}
  const p=P();return hero('Profile','@'+esc(user))+`<div class="card float" style="text-align:center"><div class="av pav">${ini()}</div><b class="big" style="font-size:20px">${esc(nm())}</b><div class="mu">${esc(p.shop||'Add your shop name below')}</div></div>
    <div class="card"><b>Your details</b><br><label>Username</label><input value="${esc(user)}" disabled><label>Full name</label><input id="pf1" value="${esc(p.name)}"><label>Shop name</label><input id="pf2" value="${esc(p.shop)}">
    <label>Email</label><input id="pf3" type="email" value="${esc(p.email)}"><label>Phone</label><input id="pf4" type="tel" value="${esc(p.phone)}"><label>Shop address</label><textarea id="pf5" rows="2">${esc(p.addr)}</textarea><button class="w" onclick="saveProfile()">Save profile</button></div>
    <div class="card"><b>Appearance</b><select onchange="theme(this.value)"><option value="">Match my phone</option><option value="light">Light</option><option value="dark">Dark</option></select></div>
    <div class="card"><b>Password</b><br><label>Current password</label><input id="po" type="password"><label>New password</label><input id="pn" type="password"><button class="g w" onclick="savePass()">Update password</button></div>
    <div class="card"><b>Your data</b><div class="acts"><button class="g" onclick="exportXlsx()">Excel</button><button class="g" onclick="backup()">Backup</button><button class="g" onclick="$('#rf').click()">Restore</button><button class="x" onclick="wipe()">Clear all</button></div><input id="rf" type="file" accept=".json" hidden onchange="restore(this)"></div>
    <button class="g w" onclick="logout()">Log out</button>`;
}
function sheetH(){
  if(!sheet)return'';const id=sheet.id;
  if(sheet.type==='bill'){const b=id&&D.bills.find(x=>x.id===id)||{date:today()};
    return `<div class="ov" onclick="if(event.target===this)shut()"><div class="sheet"><h2 style="margin-top:0">${id?'Edit bill':'New bill'}</h2>
    <label>Supplier</label><select id="sb1">${D.dist.map(d=>`<option value="${d.id}" ${d.id===b.dist?'selected':''}>${esc(dn(d.id))}</option>`).join('')||'<option value="">Add a supplier first</option>'}</select>
    <div class="row"><div><label>Date</label><input id="sb2" type="date" value="${b.date}"></div><div><label>Amount (₹)</label><input id="sb3" type="number" inputmode="decimal" value="${b.amount||''}"></div></div>
    <label>Items (optional)</label><input id="sb4" placeholder="Pampers, Haldiram, Coca-Cola" value="${esc(b.note)}">
    <label>Bill photo or screenshot</label><input id="sb5" type="file" accept="image/*" onchange="prev(this)"><div id="pv">${b.img?`<img class="th" src="${b.img}" alt="Bill">`:''}</div>
    <label style="display:flex;align-items:center;margin:12px 0"><input type="checkbox" id="sb6" ${b.paid?'checked':''}>Already paid</label>
    <div class="row"><button class="g" onclick="shut()">Cancel</button><button onclick="saveBill()">Save bill</button></div></div></div>`}
  const d=id&&sup(id)||{};
  return `<div class="ov" onclick="if(event.target===this)shut()"><div class="sheet"><h2 style="margin-top:0">${id?'Edit supplier':'New supplier'}</h2>
  <label>Name</label><input id="sd1" value="${esc(d.name)}"><label>Company (Haldiram, Heritage, Pampers…)</label><input id="sd2" value="${esc(d.company)}"><label>Phone</label><input id="sd3" type="tel" value="${esc(d.phone)}">
  <div class="row"><div><label>Next visit date</label><input id="sd4" type="date" value="${esc(d.next)}"></div><div><label>Advance to pay (₹)</label><input id="sd5" type="number" inputmode="decimal" value="${d.advance||''}"></div></div>
  <label>Notes</label><input id="sd6" value="${esc(d.note)}"><div class="row"><button class="g" onclick="shut()">Cancel</button><button onclick="saveDist()">Save supplier</button></div></div></div>`;
}
function render(){
  if(!user){$('#app').innerHTML=`<div class="login"><div class="auth"><div class="logo">🧾</div><div class="brand">SHOPBILLS</div><h1>${mode==='login'?'Welcome back':'Create your account'}</h1><p class="hs">Bills, suppliers and payment dates, all in one place.</p>
  <div class="card" onkeydown="if(event.key==='Enter')auth()"><label>Username</label><input id="u" autocomplete="username">${mode==='signup'?'<label>Email (optional)</label><input id="em" type="email">':''}<label>Password</label><input id="p" type="password" autocomplete="current-password">
  <div class="err">${esc(msg)}</div><button class="w" onclick="auth()">${mode==='login'?'Log in':'Sign up'}</button>
  <p class="mu" style="text-align:center;margin:12px 0 0">${mode==='login'?'New here?':'Already registered?'} <a href="#" style="color:var(--gd);font-weight:700" onclick="mode='${mode==='login'?'signup':'login'}';msg='';render();return false">${mode==='login'?'Create an account':'Log in'}</a></p></div>
  <div class="feat"><span>📸 Snap bills</span><span>🚚 Track suppliers</span><span>⏰ Never miss a payment</span></div></div></div>`;return}
  const z=zoom&&D.bills.find(b=>b.id===zoom);
  $('#app').innerHTML=`<div class="wrap">${view()}</div>
  <div class="nav">${[['home','🏠','Home'],['bills','🧾','Bills'],['dist','🚚','Suppliers'],['rep','📊','Reports'],['prof','👤','Profile']].map(([k,i,l])=>`<button class="${tab===k?'on':''}" onclick="tab='${k}';render();scrollTo(0,0)"><span>${i}</span>${l}</button>`).join('')}</div>
  ${['home','bills','dist'].includes(tab)?`<button class="fab" aria-label="Add" onclick="openSheet('${tab==='dist'?'dist':'bill'}')">+</button>`:''}${sheetH()}
  ${z&&z.img?`<div class="ov zoom" onclick="zoom=null;render()"><img src="${z.img}" alt="Bill"></div>`:''}`;
}
boot();
</script></body></html>
